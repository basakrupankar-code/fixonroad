<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <!-- ══ Favicon & Bookmark Icons ══════════════════════════════════
         Resolution guide:
         - favicon.svg          → modern browsers (Chrome 80+, Firefox, Edge) — scalable, preferred
         - favicon-32x32.png    → browser tab, bookmarks bar on older browsers
         - apple-touch-icon.png → iOS Safari "Add to Home Screen" (180×180 px required)
         - favicon-192x192.png  → Android Chrome home screen shortcut
         - favicon-512x512.png  → Android splash screen / PWA install prompt
         - site.webmanifest     → PWA metadata (links 192 + 512 PNGs, sets theme/bg color)
    ═══════════════════════════════════════════════════════════════════ -->

    <!-- 1. SVG favicon — modern browsers, scales perfectly at any size -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 2. 32×32 PNG fallback — older Chrome, Firefox, desktop bookmarks bar -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- 3. 16×16 PNG — smallest favicon, legacy IE/older Firefox tab -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- 4. Apple Touch Icon — iOS "Add to Home Screen" bookmark (180×180 px) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- 5. Android / PWA manifest — enables installability & home screen icon -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 6. Windows tile color (IE11 / Edge legacy pinned sites) -->
    <meta name="msapplication-TileColor" content="#f97316" />

    <!-- 7. Browser UI theme color (Chrome on Android address bar) -->
    <meta name="theme-color" content="#0A0E1A" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FixOnRoad — On-demand roadside assistance for two-wheelers. Find nearby mechanics, fixed pricing, live tracking, and secure payments in Kalyani, West Bengal." />
    <meta name="keywords" content="roadside assistance, bike repair, mechanic near me, two-wheeler, Kalyani, West Bengal" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <title>FixOnRoad — On-Demand Roadside Help for Bikes & Cars</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
